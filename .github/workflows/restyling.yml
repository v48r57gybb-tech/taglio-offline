name: Restyling app e pubblicazione
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restyling.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: restyling-pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Applica modifiche mirate e genera icone
        run: |
          python - <<'PY'
          import base64, io, re, shutil, subprocess
          from pathlib import Path
          from collections import deque
          from PIL import Image
          source = ''
          page = Path('index.html')
          html = page.read_text()
          marker = '/* visual-refresh-approved-v1 */'
          if marker not in Path('comic.css').read_text():
              actual = subprocess.check_output(['git','hash-object','index.html'], text=True).strip()
              assert actual == '02b51b2300c0146d83614f93debee4c81cc9ef4c', 'index.html modificato: interrompo per evitare sovrascritture'
              def replace(old, new):
                  global html
                  assert html.count(old) == 1, old
                  html = html.replace(old, new, 1)
              toolbar = '<div class="toolbar"><button id="install" hidden type="button">INSTALLA APP</button></div>'
              replace(toolbar, '')
              replace('<details class="help"><summary>Come usare e installare l’app</summary>', '<details class="help infopoint"><summary><span aria-hidden="true">ⓘ </span>Infopoint installazione e utilizzo</summary>' + toolbar)
              replace('Archivio conservato in questo browser.', 'Archivio conservato in dispositivo locale.')
              replace('>COPIA MAIL</button>', '>Copia mail</button>')
              replace('>APRI EMAIL</a>', '>Apri email</a>')
              replace('<details class="fold" id="preview">', '<p id="actionStatus" class="action-status" hidden></p><details class="fold" id="preview">')
              replace('function toast(s){clearTimeout(timer);', 'function toast(s){const inline=$("actionStatus");if(inline){inline.hidden=!/^(Articolo salvato|Mail copiata)/.test(s);inline.textContent=inline.hidden?"":"✓ "+s;}clearTimeout(timer);')
              replace("same?'Articolo salvato'", "same?'✓ Articolo salvato'")
              replace("function markDirty(){if(current){", "function markDirty(){document.querySelectorAll('[aria-invalid]').forEach(el=>{el.removeAttribute('aria-invalid');el.removeAttribute('aria-describedby')});$('actionStatus').hidden=true;if(current){")
              replace("current=null;$(id).focus()", "current=null;$(id).setAttribute('aria-invalid','true');$(id).setAttribute('aria-describedby','error');$(id).focus()")
              assert "KEY='cnc-taglio-articoli-v1'" in html and 'SIZES=[3000,6000]' in html
              script = re.search(r'<script>(.*?)</script>', html, re.S).group(1)
              Path('/tmp/app-check.js').write_text(script)
              subprocess.run(['node','--check','/tmp/app-check.js'], check=True)
              css = '''
          /* visual-refresh-approved-v1 */
          :root{--ink:#17252d;--muted:#dfe9ef;--line:#17252d}
          body{background-color:#f2f4f3;background-image:linear-gradient(#314c5f09 1px,transparent 1px),linear-gradient(90deg,#314c5f09 1px,transparent 1px);color:#17252d}
          main{max-width:820px;padding-top:28px}.layout{grid-template-columns:minmax(0,1fr);gap:24px}.brand img{width:96px;height:96px;border-radius:0}.brand h1{letter-spacing:-.8px}.brand .eyebrow{color:#4b667b}header>p{font-size:15px;color:#405968}
          .card{border-width:2px;border-radius:12px;box-shadow:3px 4px 0 #17252d;padding:26px}#inputPanel{background:#fafbf8;color:#17252d}#inputPanel .eyebrow{color:#405968}#inputPanel p,#inputPanel .help p{color:#40515c}#inputPanel summary{color:#405968}#inputPanel .help{border-color:#c5d1d6}#inputPanel .hint{color:#40515c}
          label{margin-top:20px;font-weight:700}input,select{min-height:54px;background:white;border-color:#6a7d88;box-shadow:none;border-radius:7px;font-variant-numeric:tabular-nums}input[aria-invalid=true],select[aria-invalid=true]{border:2px solid #a32236;background:#fff5f6}button,.button{min-height:48px;border-radius:7px;box-shadow:2px 3px 0 #17252d;font-size:14px;font-weight:750}.primary{background:#ffe04c;color:#17252d}.quiet{min-height:46px;font-size:13px}.wide{margin-top:24px}
          header details.help.infopoint{border:0;border-radius:0;background:transparent;padding:0;margin:10px 0 0;box-shadow:none}header .infopoint>summary{display:list-item;width:fit-content;max-width:100%;padding:12px 0;font-size:13px;font-weight:500;color:#405968}header .infopoint p{font-size:13px;max-width:68ch;color:#40515c}header .infopoint .toolbar{margin:6px 0 14px}#install{background:#e6edf0;font-size:13px;box-shadow:none}
          #result{background:#4b667b;color:white}#result p{color:#f1f6f8}.article-row{border-color:#b5c7d266}.article-row>span{font-size:13px;letter-spacing:.5px}.headline{color:white;text-shadow:none;font-size:clamp(32px,6vw,46px);line-height:1.15;margin:14px 0 26px}#result h3{color:#fff;font-size:13px;letter-spacing:.7px}#intro{margin-bottom:0;font-size:15px}.line{align-items:baseline;gap:20px}.line strong,.offcut strong{font-variant-numeric:tabular-nums}.offcut{background:#f1f5f4;color:#17252d;border:1px solid #17252d;border-left:5px solid #c6d1d8;padding:15px}.offcut strong{color:#17252d}.actions{gap:12px}#copy{background:#ffe04c;color:#17252d}#email{background:#e6edf0;color:#17252d}#result .action-status{color:#fff;background:#185b45;border:1px solid #b9e2cf;border-radius:6px;font-size:13px;padding:10px 12px}.fold{border-top:1px solid #b5c7d266}.fold summary{min-height:48px;display:list-item}.back{box-shadow:none}#save:disabled{background:#d8efdf;color:#164630;opacity:1;box-shadow:none}
          .archive{background:#fafbf8;color:#17252d;border-width:1px;box-shadow:none}.archive>summary,.archive .help summary{color:#263f50}.archive .hint,.archive p,.archive th{color:#40515c}.archive .help{border-color:#c5d1d6}.archive tr{background:transparent}.archive td,.archive th{border-color:#d5dee1}.archive td[data-label]:before{color:#40515c}footer{font-size:11px;border-top:1px solid #c5d1d6;color:#405968}footer strong{font-size:13px}input:focus,select:focus{outline-color:#315d7b}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #244d69;outline-offset:4px}#result button:focus-visible,#result a:focus-visible,#result summary:focus-visible{outline-color:#ffe04c}#toast{background:#e1f2e8;color:#164630;box-shadow:2px 3px 0 #17252d;font-size:14px}
          @media(max-width:700px){main{padding:20px 16px 26px}.brand{gap:12px}.brand img{width:78px;height:78px}.brand h1{font-size:26px}.card{padding:20px;box-shadow:2px 3px 0 #17252d}.headline{font-size:34px}.article-row{align-items:flex-start}.actions{flex-direction:column}.archive tr{border:1px solid #c5d1d6;background:white}.archive td button{min-height:46px}footer{gap:14px}}
          @media(max-width:360px){.brand img{width:64px;height:64px}.brand h1{font-size:23px}.card{padding:16px}.line{gap:10px;font-size:14px}}
          @media print{#inputPanel,header,.archive,.actions,.back,#save,footer,#toast,.action-status{display:none!important}#result{background:white;color:black;border:1px solid black;box-shadow:none}#result h3,#result p,.headline{color:black}.offcut{background:white;color:black}.offcut strong{color:black}}
          '''
              page.write_text(html)
              with Path('comic.css').open('a') as f: f.write(css)
              sw = Path('sw.js').read_text()
              assert 'taglio-mho-comic-v4' in sw
              Path('sw.js').write_text(sw.replace('taglio-mho-comic-v4','taglio-mho-visual-v5'))
          image = Image.open(io.BytesIO(base64.b64decode(source, validate=True))).convert('RGBA')
          assert image.size == (512,512)
          px = image.load(); seen = set(); queue = deque([(0,0)])
          while queue:
              x,y = queue.popleft()
              if not (0 <= x < 512 and 0 <= y < 512) or (x,y) in seen: continue
              seen.add((x,y)); rgb = px[x,y][:3]
              if max(rgb)>30 or max(rgb)-min(rgb)>10: continue
              px[x,y] = (*rgb,0)
              queue.extend(((x-1,y),(x+1,y),(x,y-1),(x,y+1)))
          output = io.BytesIO(); image.save(output, format='PNG', optimize=True)
          png = base64.b64encode(output.getvalue()).decode()
          Path('icon.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><image width="512" height="512" href="data:image/png;base64,'+png+'"/></svg>')
          Path('icons').mkdir(exist_ok=True)
          for size in (180,192,512):
              tile = Image.new('RGBA',(512,512),'#263F50'); tile.alpha_composite(image)
              tile.convert('RGB').resize((size,size),Image.Resampling.LANCZOS).save(f'icons/tile-{size}.png',optimize=True)
          deploy = Path('_site'); deploy.mkdir(exist_ok=True)
          for name in ('index.html','comic.css','icon.svg','manifest.webmanifest','sw.js'): shutil.copy(name,deploy/name)
          shutil.copytree('icons',deploy/'icons',dirs_exist_ok=True)
          for file in deploy.rglob('*'):
              if file.is_file(): assert file.stat().st_size>0
          PY
      - name: Salva restyling e icone nel repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html comic.css icon.svg sw.js icons/tile-180.png icons/tile-192.png icons/tile-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Applica logo approvato, layout chiaro e infopoint discreto'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
