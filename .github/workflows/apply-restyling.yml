name: Applica e verifica restyling
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-restyling.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recupero-restyling
  cancel-in-progress: false
jobs:
  apply:
