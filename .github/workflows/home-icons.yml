name: Genera icone Home PNG
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/home-icons.yml'
      - 'icon.svg'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: home-icons
  cancel-in-progress: false
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Genera icone ritagliate
        run: |
          python - <<'PY'
          import base64, io
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from PIL import Image
          root = ET.fromstring(Path('icon.svg').read_text())
          element = root.find('{http://www.w3.org/2000/svg}image')
          if element is None:
              raise RuntimeError('Immagine non trovata')
          href = element.attrib.get('href', '')
          if not href.startswith('data:image/') or ';base64,' not in href:
              raise RuntimeError('Immagine incorporata non valida')
          image = Image.open(io.BytesIO(base64.b64decode(href.split(',', 1)[1], validate=True))).convert('RGBA')
          Path('icons').mkdir(exist_ok=True)
          for size in (180, 192, 512):
              image.resize((size, size), Image.Resampling.LANCZOS).save('icons/tile-' + str(size) + '.png', format='PNG', optimize=True)
          PY
      - name: Salva le nuove icone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/tile-180.png icons/tile-192.png icons/tile-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Genera nuova icona ritagliata per app e Home'
            git push origin HEAD:main
          fi
