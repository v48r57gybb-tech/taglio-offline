          Image.open(io.BytesIO(raw)).verify()
          assert Image.open(io.BytesIO(raw)).size == (512,512)
          workflow = yaml.safe_load(Path('.github/workflows/restyling.yml').read_text())
          steps = workflow['jobs']['refresh']['steps']
          candidates = [s['run'] for s in steps if s.get('name') == 'Applica modifiche mirate e genera icone']
          assert len(candidates) == 1
          command, count = re.subn(r"(?m)^source = '[^']*'$", lambda m: 'source = '+repr(source), candidates[0])
          assert count == 1
          subprocess.run(['bash','-e','-c',command], check=True)
          html = Path('index.html').read_text()
          assert 'Infopoint installazione e utilizzo' in html
          assert 'Archivio conservato in dispositivo locale.' in html
          assert 'Come usare e installare l’app' not in html
          assert 'Archivio conservato in questo browser.' not in html
          assert 'data:image/png;base64,' in Path('icon.svg').read_text()
          assert "KEY='cnc-taglio-articoli-v1'" in html and 'SIZES=[3000,6000]' in html
          css = Path('comic.css').read_text()
          if 'footer-local-right-v1' not in css:
              css += '\n/* footer-local-right-v1 */\nfooter>div:last-child{text-align:right;margin-left:auto;max-width:100%}\n'
          Path('comic.css').write_text(css)
          shutil.copy('comic.css','_site/comic.css')
          Path('/tmp/app-verified.js').write_text(re.search(r'<script>(.*?)</script>',html,re.S).group(1))
          subprocess.run(['node','--check','/tmp/app-verified.js'],check=True)
          PY
      - name: Salva i file aggiornati
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html comic.css icon.svg sw.js icons/tile-180.png icons/tile-192.png icons/tile-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Corregge logo e applica infopoint discreto e archivio locale'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  publish:
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica versione verificata
        id: deployment
        uses: actions/deploy-pages@v4
